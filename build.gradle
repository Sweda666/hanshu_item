// Forge 26.1.2 mod workspace.
//
// This build uses ForgeGradle 7 (`net.minecraftforge.gradle` `[7.0.17,8)`), which is what
// Minecraft 26.1+ requires. ForgeGradle 6.x cannot build against MC 26.1 because Mojang no
// longer publishes `client_mappings` / `server_mappings` in the version manifest.
// Keep the Gradle wrapper at 9.5.0 or newer to match.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

minecraft {
    // The mappings can be changed at any time.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    mappings channel: mapping_channel, version: mapping_version

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            // Mixin needs to be told about the config explicitly (FG7 has no MixinGradle integration).
            args "--mixin.config=${mod_id}.mixins.json"

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-logging-levels
            systemProperty 'forge.logging.console.level', 'debug'
        }

        register('client') {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            // example of overriding the workingDirectory set in configureEach above
            workingDir = layout.projectDirectory.dir('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // `minecraft.mavenizer` produces the remapped Minecraft/Forge artifacts that the
    // `minecraft.dependency(...)` entry below resolves against.
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    // Put repositories for dependencies here.
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // The `minecraft.dependency` helper resolves through the ForgeGradle mavenizer so that
    // Minecraft, Forge and the libraries are all remapped to the configured mappings.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // Mixin annotation processor - generates the refmap declared in hanshu_item.mixins.json
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some
    // transitive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    // Lets Mixin find our config at runtime.
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// NOTE: ForgeGradle 6 templates ended with a block that pointed a source set's resources and classes at
// the same directory ("merge the resources and classes into the same directory"). ForgeGradle 7 does that
// itself, driven by `net.minecraftforge.gradle.merge-source-sets=true` in gradle.properties, and it merges
// into build/sourceSets/<name>. Keeping the old block around double-merges and breaks the jar contents.

// --- 自检用的类路径导出 ---------------------------------------------------------
//
// 项目里有几个「不启动游戏」的自检类（原生 NBT 存取、同步逻辑、GUI 布局…），它们要能直接
// `java -cp ...` 跑起来。手工拼 Minecraft 的依赖列表（brigadier / fastutil / datafixerupper…）
// 既麻烦又容易漏，所以导出一份完整类路径：
//
//   gradlew.bat printCheckClasspath
//   java -cp "<输出的内容>" sweda.hanshu_item.overture.runtime.NativeNbtSyncCheck
//
// 这个任务只写一个文本文件，不参与构建产物。
tasks.register('printCheckClasspath') {
    group = 'verification'
    description = '导出自检类所需的运行时类路径到 build/check-classpath.txt'
    def runtime = sourceSets.main.runtimeClasspath
    def outputFile = layout.buildDirectory.file('check-classpath.txt')
    inputs.files(runtime)
    outputs.file(outputFile)
    doLast {
        outputFile.get().asFile.text = runtime.asPath
        println "已写入 ${outputFile.get().asFile}"
    }
}
